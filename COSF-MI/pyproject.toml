[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosf-mi"
version = "0.1.0"
description = "Mechanistic Interpretability Through Cosmological Synchronization Factor Analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Sportysport"}]
keywords = ["mechanistic-interpretability", "neural-networks", "transformers", "cosf", "golden-ratio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "transformers>=4.30.0",
    "transformer-lens>=1.0.0",
    "einops>=0.6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "ruff>=0.0.270", "mypy>=1.0.0"]
viz = ["matplotlib>=3.7.0", "plotly>=5.14.0"]
cuda = ["cupy-cuda12x>=12.0.0"]

[project.scripts]
cosf-mi = "cosf_mi.cli:main"

[project.urls]
Homepage = "https://github.com/sportysport74/COSF-MI"
Repository = "https://github.com/sportysport74/COSF-MI"

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-dir]
"" = "src/python"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
