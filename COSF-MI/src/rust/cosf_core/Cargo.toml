[package]
name = "cosf_core"
version = "0.1.0"
edition = "2021"
authors = ["Sportysport"]
description = "High-performance COSF computations in Rust"
license = "MIT"
repository = "https://github.com/sportysport74/COSF-MI"

[lib]
name = "cosf_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Numerical computing
ndarray = "0.15"
num-complex = "0.4"
num-traits = "0.2"

# FFT
rustfft = "6.1"

# Parallelism
rayon = "1.8"

# Python bindings (optional)
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
numpy = { version = "0.20", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
python = ["pyo3", "numpy"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "phi_decomposition"
harness = false
